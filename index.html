<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine’s Day Special</title>

  <style>
    :root{
      --card:#ffffff;
      --accent:#ffafcc;
      --accent2:#d62828;
      --text:#8a1538;
      --muted:#7a7a7a;
    }

    *{ box-sizing:border-box; }

    /* Premium romantic background (not plain, not cheap) */
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(900px 600px at 20% 15%, rgba(255, 200, 221, 0.55), transparent 60%),
        radial-gradient(700px 500px at 80% 20%, rgba(255, 225, 238, 0.55), transparent 55%),
        radial-gradient(900px 650px at 50% 85%, rgba(255, 175, 204, 0.35), transparent 60%),
        linear-gradient(180deg, #fff0f6 0%, #fde2e4 55%, #f8c6d8 100%);
      font-family: "Noto Sans Gurmukhi","Nirmala UI","Mukta Mahee",Arial,sans-serif;
      color:var(--text);
      overflow-x:hidden;
    }

    /* English font: basic + romantic */
    .eng{
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: 0.2px;
    }

    /* Floating hearts layer */
    .hearts-layer{
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    /* BIG premium hearts */
    .heart{
      position: absolute;
      width: 46px;
      height: 46px;
      opacity: 0.16;
      filter: blur(0.4px) drop-shadow(0 18px 30px rgba(0,0,0,0.12));
      transform: translateZ(0);
      animation: driftUp linear forwards;
    }

    @keyframes driftUp{
      from{
        transform: translateY(40px) translateX(0) scale(0.9) rotate(0deg);
        opacity: 0;
      }
      15%{ opacity: 0.16; }
      to{
        transform: translateY(-120vh) translateX(var(--dx)) scale(var(--sc)) rotate(var(--rot));
        opacity: 0;
      }
    }

    .card{
      position: relative;
      z-index: 1;
      width: min(560px, 92vw);
      background: var(--card);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1,h2{ margin: 6px 0 10px; color: var(--accent2); }
    p{ margin: 10px 0; line-height: 1.45; }
    .hint{ font-size:13px; color:var(--muted); margin-top:10px; }

    .textBox{
      margin-top:12px;
      padding:14px 16px;
      background:#fff0f6;
      border:1px solid #ffd6e8;
      border-radius:18px;
      color:var(--text);
      white-space:pre-line;
      font-size:15px;
      line-height:1.6;
      text-align:left;
    }

    .shayariBox{
      margin-top:14px;
      padding:14px 16px;
      background:#fff0f6;
      border:1px solid #ffd6e8;
      border-radius:18px;
      color:var(--text);
      white-space:pre-line;
      font-size:16px;
      line-height:1.65;
      text-align:center;
    }

    .btn{
      border:none;
      border-radius:999px;
      padding:12px 16px;
      font-size:16px;
      cursor:pointer;
      margin-top:14px;
    }
    .primary{ background:var(--accent); color:var(--text); font-weight:900; }
    .ghost{ background:#f2f2f2; color:#333; }

    .navRow{
      display:flex;
      gap:12px;
      justify-content:center;
      margin-top:12px;
      flex-wrap:wrap;
    }

    #yesBtn{
      background:var(--accent);
      color:var(--text);
      padding:14px 26px;
      font-size:18px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:900;
      transition: transform 0.18s ease;
    }

    #noBtn{
      background:#f2f2f2;
      color:#333;
      padding:10px 18px;
      font-size:14px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      position:relative;
      transition: transform 0.18s ease, opacity 0.25s ease;
    }

    .gifWrap{
      margin-top:12px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid #ffd6e8;
      background:#fff;
    }
    .gifWrap img{
      width:100%;
      display:block;
    }
  </style>
</head>

<body>
  <div class="hearts-layer" id="hearts"></div>
  <div class="card" id="app"></div>

<script>
  // ✅ Change names if needed
  const herName = "Siyu";
  const yourName = "Chingu";

  // ✅ Page 1 text
  const introEnglish = Kuj lines tuhadi tareef ch❤️`;
  const introPunjabi = `ਤੇਰੀਆ ਅੱਖਾ, ਤੇਰੀਆ ਗਲਾਂ, ਤੇਰੇ ਬਾਲ, ਤੇਰੀ ਚਾਲ , ਤੇਰੇ ਝੁਮਕੇ, ਤੇਰੀ ਫੁਲਕਾਰੀ,
ਮੈਂ ਵਾਦਾ ਕਰਦਾ ਮੈਂ ਕਢ ਦੇਣੀ ਆਪਣੀ ਜਿੰਦ ਤੇਰੀ ਨਾਲ ਸਾਰੀ,
ਮੈਂ ਅੱਖ ਬੰਦ ਕਰਦਾ ਤੂੰ ਦਿਸੇ
ਮੈਂ ਅਖਾਂ ਖੋਲਾ ਤਾ ਤੂੰ ਦਿਸੇ
ਮੈਂ ਸਾਰੀ ਜਿੰਦਗੀ ਤੇਰੇ ਨਾਲ ਜਿਊਣੀ ਏ...।
ਤੂੰ ਸਭ ਤੋਂ ਸੋਹਣੀ ਏ... ਤੂੰ ਸਭ ਤੋਂ ਸੋਹਣੀ ਏ....❤️`;

  // ✅ Page 2 shayari
  const shayariPage2 = `ਸਾਨੂੰ ਤੂੰ ਮਿਲਿਆ,
ਸਾਡੀ ਰੂਹ ਰਜੱ ਗਈ,
ਤੇਰਾ ਨਾਮ ਲੇਕੇ ਚੰਨਾ,
ਸਾਡੀ ਜਿੰਦ ਸੱਜ ਗਈ।`;

  // ✅ Page 2 YAY gif (you can replace with your own uploaded file e.g. "yay.gif")
  const yayGif = "https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif";

  const app = document.getElementById("app");
  let page = 1;
  let yesScale = 1;

  function render(){
    if(page === 1) renderPage1();
    else if(page === 2) renderPage2();
    else renderPage3();
  }

  function renderPage1(){
    app.innerHTML = `
      <h1>Valentine’s Day Special 💌</h1>

      <p class="eng" style="font-size:18px;font-weight:700;margin-top:2px;">
        Hello ${herName} ❤️<br>
        This side your ${yourName} 😌
      </p>

      <div class="textBox">
        <span class="eng" style="display:block;font-size:17px;font-weight:700;">
          ${introEnglish}
        </span>
        <div style="margin-top:10px;">
          ${introPunjabi}
        </div>
      </div>

      <button class="btn primary" onclick="next()">Next ➜</button>
      <p class="hint">Bas ik hor page 😌</p>
    `;
  }

  function renderPage2(){
    app.innerHTML = `
      <h1>YAYYYY 💕</h1>

      <div class="gifWrap">
        <img src="${yayGif}" alt="yay gif">
      </div>

      <div class="shayariBox">${shayariPage2}</div>

      <button class="btn primary" onclick="next()">Next ➜</button>
      <p class="hint">Hun last page aa… 😈</p>
    `;
  }

  function renderPage3(){
    yesScale = 1;
    app.innerHTML = `
      <h1>${herName}… 💖</h1>
      <h2 style="margin-top:6px;">ਕੀ ਤੂੰ ਮੇਰੀ ਵੇਲਨਟਾਈਨ ਬਣੇਗੀ? 💌</h2>
      

      <div class="navRow">
        <button id="yesBtn" onclick="yesClicked()">ਹਾਂ 🥰</button>
        <button id="noBtn" onmouseover="noTried()" onclick="noTried()" ontouchstart="noTried()">ਨਹੀਂ</button>
      </div>

      <button class="btn ghost" onclick="back()">⬅ Back</button>
    `;
  }

  function next(){
    page = Math.min(3, page + 1);
    render();
  }

  function back(){
    page = Math.max(1, page - 1);
    render();
  }

  function noTried(){
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    if(!noBtn || !yesBtn) return;

    const x = (Math.random()*220) - 110;
    const y = (Math.random()*160) - 80;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;

    yesScale += 0.22;
    yesBtn.style.transform = `scale(${yesScale})`;

    if(yesScale >= 2.2){
      noBtn.style.opacity = "0";
      noBtn.style.pointerEvents = "none";
    }
  }

  function yesClicked(){
    app.innerHTML = `
      <h1>Hehe 😌❤️</h1>

      <p style="font-size:18px;margin-top:6px;">
        Pav bhaji di kasam, kabhi dhokha nahi dunga 🥖❤️<br>
        — <span class="eng" style="font-weight:800;">${yourName}</span>
      </p>

      <div class="shayariBox">${shayariPage2}</div>

      <button class="btn primary" onclick="page=1; render()">Back to Start</button>
    `;
  }

  function spawnHearts(batch = 6){
    const layer = document.getElementById("hearts");
    if(!layer) return;

    const heartSVG = `
      <svg viewBox="0 0 24 24" width="46" height="46" aria-hidden="true">
        <path d="M12 21s-7.2-4.6-9.6-8.7C.7 9.4 2 6.5 4.9 5.6c2-.6 3.8.2 5 1.6 1.2-1.4 3-2.2 5-1.6 2.9.9 4.2 3.8 2.5 6.7C19.2 16.4 12 21 12 21z"
              fill="rgba(214,40,40,0.45)"/>
      </svg>
    `;

    for(let i=0;i<batch;i++){
      const h = document.createElement("div");
      h.className = "heart";
      h.innerHTML = heartSVG;

      const left = Math.random()*100;
      const delay = Math.random()*2.2;
      const duration = 14 + Math.random()*14;   // slow & premium
      const size = 38 + Math.random()*34;       // BIG hearts 38-72px
      const dx = (Math.random()*140 - 70).toFixed(0) + "px";
      const sc = (0.9 + Math.random()*0.8).toFixed(2);
      const rot = (Math.random()*90 - 45).toFixed(0) + "deg";

      h.style.left = left + "vw";
      h.style.bottom = (-30 - Math.random()*60) + "px";
      h.style.animationDelay = delay + "s";
      h.style.animationDuration = duration + "s";
      h.style.width = size + "px";
      h.style.height = size + "px";
      h.style.setProperty("--dx", dx);
      h.style.setProperty("--sc", sc);
      h.style.setProperty("--rot", rot);

      layer.appendChild(h);
      setTimeout(()=>h.remove(), (delay+duration)*1000 + 300);
    }

    setTimeout(()=>spawnHearts(2), 1600); // few hearts = classy
  }

  spawnHearts(6);
  render();
</script>
</body>
</html>
