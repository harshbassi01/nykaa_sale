<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine’s Day Special</title>

  <style>
    :root{
      --card:#ffffff;
      --accent:#ffafcc;
      --accent2:#d62828;   /* romantic red */
      --text:#8a1538;      /* romantic maroon */
      --muted:#7a7a7a;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(circle at top, #ffe3ec 0%, #fde2e4 45%, #f8c6d8 100%);
      font-family: "Noto Sans Gurmukhi","Nirmala UI","Mukta Mahee",Arial,sans-serif;
      color:var(--text);
      overflow-x:hidden;
    }

    /* English font: simple + romantic */
    .eng{
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: 0.2px;
    }

    /* Floating hearts layer */
    .hearts-layer{
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart{
      position: absolute;
      font-size: 18px;
      opacity: 0.9;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.18));
      animation: floatUp linear forwards;
      transform: translateZ(0);
    }

    @keyframes floatUp{
      from{
        transform: translateY(30px) scale(0.9);
        opacity: 0;
      }
      10%{ opacity: 0.95; }
      to{
        transform: translateY(-120vh) scale(1.25);
        opacity: 0;
      }
    }

    .card{
      position: relative;
      z-index: 1;
      width: min(560px, 92vw);
      background: var(--card);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1,h2{ margin: 6px 0 10px; color: var(--accent2); }
    p{ margin: 10px 0; line-height: 1.45; }
    .hint{ font-size:13px; color:var(--muted); margin-top:10px; }

    .navRow{
      display:flex;
      gap:12px;
      justify-content:center;
      margin-top:12px;
      flex-wrap:wrap;
    }

    #yesBtn{
      background:var(--accent);
      color:var(--text);
      padding:14px 26px;
      font-size:18px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:900;
      transition: transform 0.18s ease;
    }

    #noBtn{
      background:#f2f2f2;
      color:#333;
      padding:10px 18px;
      font-size:14px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      position:relative;
      transition: transform 0.18s ease, opacity 0.25s ease;
    }

    .textBox{
      margin-top:12px;
      padding:14px 16px;
      background:#fff0f6;
      border:1px solid #ffd6e8;
      border-radius:18px;
      color:var(--text);
      white-space:pre-line;
      font-size:15px;
      line-height:1.6;
      text-align:left;
    }

    .shayariBox{
      margin-top:14px;
      padding:14px 16px;
      background:#fff0f6;
      border:1px solid #ffd6e8;
      border-radius:18px;
      color:var(--text);
      white-space:pre-line;
      font-size:16px;
      line-height:1.65;
      text-align:center;
    }

    hr{
      border:none;
      border-top:1px solid #ffd6e8;
      margin:16px 0;
    }

    .btnSmall{
      border:none;
      border-radius:999px;
      padding:10px 14px;
      background:#f2f2f2;
      cursor:pointer;
      color:#333;
      margin-top:12px;
    }
  </style>
</head>

<body>
  <div class="hearts-layer" id="hearts"></div>
  <div class="card" id="app"></div>

<script>
  // ✅ Edit only these if needed
  const herName = "Siyu";
  const yourName = "Chingu";

  // ✅ Your intro lines
  const introEnglish = `I will not say you are beautiful, instead I would say: ❤️`;

  const introPunjabi = `ਤੇਰੀਆ ਅੱਖਾ, ਤੇਰੀਆ ਗਲਾਂ, ਤੇਰੇ ਬਾਲ, ਤੇਰੀ ਚਾਲ , ਤੇਰੇ ਝੁਮਕੇ, ਤੇਰੀ ਫੁਲਕਾਰੀ,
ਮੈਂ ਵਾਦਾ ਕਰਦਾ ਮੈਂ ਕਢ ਦੇਣੀ ਆਪਣੀ ਜਿੰਦ ਤੇਰੀ ਨਾਲ ਸਾਰੀ,
ਮੈਂ ਅੱਖ ਬੰਦ ਕਰਦਾ ਤੂੰ ਦਿਸੇ
ਮੈਂ ਅਖਾਂ ਖੋਲਾ ਤਾ ਤੂੰ ਦਿਸੇ
ਮੈਂ ਸਾਰੀ ਜਿੰਦਗੀ ਤੇਰੇ ਨਾਲ ਜਿਊਣੀ ਏ...।
ਤੂੰ ਸਭ ਤੋਂ ਸੋਹਣੀ ਏ... ਤੂੰ ਸਭ ਤੋਂ ਸੋਹਣੀ ਏ....❤️`;

  // ✅ Shayari after YES (replaces song)
  const shayariAfterYes = `ਸਾਨੂੰ ਤੂੰ ਮਿਲਿਆ,
ਸਾਡੀ ਰੂਹ ਰਜੱ ਗਈ,
ਤੇਰਾ ਨਾਮ ਲੇਕੇ ਚੰਨਾ,
ਸਾਡੀ ਜਿੰਦ ਸੱਜ ਗਈ।`;

  let yesScale = 1;
  const app = document.getElementById("app");

  function renderPage(){
    yesScale = 1; // reset scale whenever page loads

    app.innerHTML = `
      <h1>Valentine’s Day Special 💌</h1>

      <p class="eng" style="font-size:18px;font-weight:700;margin-top:2px;">
        Hello ${herName} ❤️<br>
        This side your ${yourName} 😌
      </p>

      <div class="textBox">
        <span class="eng" style="display:block;font-size:17px;font-weight:700;">
          ${introEnglish}
        </span>
        <div style="margin-top:10px;">
          ${introPunjabi}
        </div>
      </div>

      <hr>

      <h2>${herName}, ਵਿਲ ਯੂ ਬੀ ਮਾਈ ਵੇਲਨਟਾਈਨ? 💖</h2>
      <p class="hint">“ਨਹੀਂ” ਥੋੜ੍ਹਾ ਸ਼ਰਮੀਲਾ ਆ 😈 (Try it 😏)</p>

      <div class="navRow">
        <button id="yesBtn" onclick="yesClicked()">ਹਾਂ 🥰</button>
        <button id="noBtn" onmouseover="noTried()" onclick="noTried()" ontouchstart="noTried()">ਨਹੀਂ</button>
      </div>
    `;
  }

  function noTried(){
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    if(!noBtn || !yesBtn) return;

    // Move No away
    const x = (Math.random()*220) - 110;
    const y = (Math.random()*160) - 80;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;

    // Grow Yes
    yesScale += 0.22;
    yesBtn.style.transform = `scale(${yesScale})`;

    // Hide No when Yes gets big enough
    if(yesScale >= 2.2){
      noBtn.style.opacity = "0";
      noBtn.style.pointerEvents = "none";
    }
  }

  function yesClicked(){
    app.innerHTML = `
      <h1>YAYYYY 💕</h1>

      <p style="font-size:18px;margin-top:6px;">
        Pav bhaji di kasam, kade dhokha nahi dunga 🥖❤️<br>
        — <span class="eng" style="font-weight:800;">${yourName}</span>
      </p>

      <div class="shayariBox">${shayariAfterYes}</div>

      <button class="btnSmall" onclick="renderPage()">Back</button>
      <p class="hint">Hun taan pakka 😌💗</p>
    `;
  }

  function spawnHearts(count = 34){
    const layer = document.getElementById("hearts");
    if(!layer) return;

    for(let i=0;i<count;i++){
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = "❤️";

      const left = Math.random() * 100;
      const delay = Math.random() * 3;
      const duration = 8 + Math.random() * 8;  // slower romantic
      const size = 14 + Math.random() * 18;

      h.style.left = left + "vw";
      h.style.bottom = (-10 - Math.random()*40) + "px";
      h.style.animationDelay = delay + "s";
      h.style.animationDuration = duration + "s";
      h.style.fontSize = size + "px";

      layer.appendChild(h);
      setTimeout(()=> h.remove(), (delay + duration) * 1000 + 200);
    }

    setTimeout(()=> spawnHearts(10), 1200);
  }

  spawnHearts();
  renderPage();
</script>
</body>
</html>
